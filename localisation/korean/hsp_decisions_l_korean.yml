  # federal claims
  HSP_federal_claims_cat:0 "연방의 영토 요구"
  HSP_federal_claims_cat_desc:0 "민주주의 국가인 우리는 이웃 나라로 함부로 진군할 수 없습니다. 우리 지방들이 요구하는 땅은 어차피 치르게 될 전쟁에서 얻거나 설득으로 얻어야 합니다. 포르투갈은 공화국이 되어야만 갈리시아와 하나가 될 것입니다."
  HSP_cede_state_to_region:0 "§Y[FROM.GetName]§! 양도"
  HSP_cede_state_to_region_desc:0 "[FROM.GetName]은(는) 우리 지방 중 한 곳이 요구하는 땅입니다. 그 지방에 넘겨줍니다."
  HSP_limited_war_morocco:0 "§Y[FROM.GetName]§!에 맞선 모로코 제한전"
  HSP_limited_war_morocco_desc:0 "[FROM.GetName]은(는) 한 번도 자기 땅이었던 적 없는 모로코 땅을 쥐고 있습니다. 짧은 제한전으로 더 큰 전쟁에 휘말리지 않고 그 땅을 모로코에 돌려줄 수 있습니다."
  HSP_limited_war_basque:0 "§Y[FROM.GetName]§!에 맞선 바스크 제한전"
  HSP_limited_war_basque_desc:0 "[FROM.GetName]이(가) 북바스크 땅을 점령하고 있습니다. 짧은 제한전으로 더 큰 전쟁에 휘말리지 않고 그 땅을 바스크에 돌려줄 수 있습니다."
  HSP_limited_war_mission:0 "제한전"
  HSP_limited_war_mission_desc:0 "기한 안에 강조된 주들을 점령해야 합니다. 성공하면 적은 강화를 받아들이고 그 땅을 우리 지방에 넘겨줄 것입니다."
  HSP_limited_war_ceasefire:0 "휴전 수락"
  HSP_limited_war_ceasefire_desc:0 "제한전은 실패했습니다. 아무것도 얻지 못한 채 백색 평화를 받아들일 수 있습니다."
  HSP_limited_war_full_war:0 "전쟁 계속"
  HSP_limited_war_full_war_desc:0 "제한전은 실패했지만 우리는 물러서지 않습니다. 이제 이 전쟁에는 제한이 없습니다."
  HSP_limited_war_start_tt:0 "§Y[FROM.GetName]§!에 선전포고하고, §Y120일§! 안에 강조된 주들을 점령해야 합니다. 기한 안에 모두 점령하면 백색 평화로 전쟁이 끝나고 그 주들은 우리 지방에 넘어갑니다. 실패하면 §Y휴전§!과 §R전면전§! 중 하나를 고릅니다."
  HSP_limited_war_full_war_tt:0 "전쟁이 일반 전쟁으로 계속됩니다. 평화는 강화 회의에서 얻어내야 합니다."
  HSP_no_limited_war_running_tt:0 "다른 제한전을 치르고 있지 않음"
  HSP_target_side_not_at_war_tt:0 "[FROM.GetName]의 편(진영, 종주국, 보장국, 함께 싸우는 나라) 중 우리와 전쟁 중인 나라가 없음"
  HSP_not_in_limited_war_tt:0 "제한전을 치르고 있지 않음"
  HSP_is_federal_partner_tt:0 "우리의 괴뢰국이거나 같은 진영에 속해 있으며, 우리와 전쟁 중이 아님"
  HSP_fund_portuguese_republicans:0 "포르투갈 공화파 지원"
  HSP_fund_portuguese_republicans_desc:0 "포르투갈 제1공화국의 망명자들이 스페인 땅에서 살라자르에 맞선 음모를 꾸미고 있습니다. 자금과 인쇄기, 은신처를 제공하면 그들의 대의가 포르투갈에 퍼질 것입니다."
  HSP_restore_the_portuguese_republic:0 "포르투갈 공화국 복원"
  HSP_restore_the_portuguese_republic_desc:0 "에스타두 노부를 무너뜨릴 때가 왔습니다."
  HSP_portuguese_republicans_30_tt:0 "민주주의 지지율 §Y30%§! 이상"
  HSP_restore_the_portuguese_republic_tt:0 "포르투갈의 민주주의 지지율이 §Y50%§! 이상이면 정권이 물러나고 포르투갈은 §Y민주주의§! 국가가 됩니다.\n그렇지 않으면 공화파가 §R내전을 일으키고§!, 우리는 그들의 편에서 참전합니다."
  HSP_offer_galician_portuguese_union:0 "갈리시아-포르투갈 통합 제안"
  HSP_offer_galician_portuguese_union_desc:0 "갈리시아와 포르투갈은 언어를 함께하며, 두 왕관보다 오래된 역사를 공유합니다. 공화국이 된 포르투갈이라면 북쪽의 형제와 하나가 되자는 설득에 응할지도 모릅니다."
  HSP_offer_galician_portuguese_union_tt:0 "포르투갈에 §Y갈리시아§!와의 통합을 제안합니다. 포르투갈이 수락하면 §Y갈리시아가 포르투갈을 병합§!합니다.\n포르투갈은 우리보다 약하고 우리에 대한 호감도가 §Y50§!을 넘으면 수락합니다."
