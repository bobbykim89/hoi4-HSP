l_korean:
  # events
  HSP_spain_events.5.t:0 "[POR.GetNameDef]과의 통일을 제안한 [SPR.GetNameDef]"
  HSP_spain_events.5.desc:0 "[SPR.GetNameDef]과 [POR.GetNameDef]는 과거 동군연합으로 전 세계의 바다를 지배한 적이 있습니다. 연합왕국을 다시 재건하여 과거의 영광을 재현하자는 제안을 받았습니다."
  HSP_spain_events.5.a:0 "우리는 다시 뭉쳐야 한다."
  HSP_spain_events.5.b:0 "우리는 관심이 없다."
  lar_spain.1.c:0 "긴급 의회에 결정을 맡긴다."
  HSP_spain_events.30.t:0 "스페인의 왕관"
  HSP_spain_events.30.desc:0 "의회는 군주제 복원에 합의했지만, 누가 왕관을 쓸지는 아직 정해지지 않았습니다. 제국의 전성기에 스페인을 다스렸던 합스부르크 왕가와 1931년까지 왕위에 있었던 부르봉 왕가 모두 왕위를 이을 후보를 내세우고 있습니다."
  HSP_spain_events.30.a:0 "오토 폰 합스부르크를 국왕으로 추대한다."
  HSP_spain_events.30.b:0 "알폰소 13세를 복위시킨다."
  HSP_spain_events.30.c:0 "카를 피우스 대공을 국왕으로 추대한다."
  HSP_spain_events.31.t:0 "범 스페인어권 연합으로의 초대"
  HSP_spain_events.31.desc:0 "[From.GetNameDef] 정부가 마드리드의 주도 아래 스페인어권 국가들을 하나로 묶는 범 스페인어권 연합에 우리를 초대했습니다."
  HSP_spain_events.31.a:0 "초대를 수락한다."
  HSP_spain_events.31.b:0 "초대를 거절한다."
  HSP_spain_events.32.t:0 "[From.GetName], 연합에 가입"
  HSP_spain_events.32.desc:0 "[From.GetNameDef] 정부가 우리의 초대를 수락하고 범 스페인어권 연합에 가입했습니다."
  HSP_spain_events.32.a:0 "연합에 온 것을 환영한다."
  HSP_spain_events.33.t:0 "[From.GetName], 초대 거절"
  HSP_spain_events.33.desc:0 "[From.GetNameDef] 정부가 범 스페인어권 연합으로의 초대를 거절했습니다."
  HSP_spain_events.33.a:0 "그들의 손해다."
  HSP_spain_events.24.t:0 "합스부르크의 왕관"
  HSP_spain_events.24.desc:0 "스페인 국왕이자 합스부르크 왕가의 수장인 [From.GetLeader]께서 [Root.GetNameDef]의 왕관을 정당한 상속권으로서 요구해 왔습니다. 이를 받아들이면 [Root.GetNameDef]는 스페인 왕관 아래의 제국 영지가 됩니다."
  HSP_spain_events.24.a:0 "국왕 폐하 만세."
  HSP_spain_events.24.b:0 "마드리드에 굴복할 수 없다."
  HSP_spain_events.25.t:0 "[From.GetName], 합스부르크 왕관 수락"
  HSP_spain_events.25.desc:0 "[From.GetNameDef] 정부가 우리 국왕을 군주로 받아들였으며, 이제 스페인 왕관 아래의 제국 영지가 됩니다."
  HSP_spain_events.25.a:0 "제국이 다시 커져간다."
  HSP_spain_events.26.t:0 "[From.GetName], 합스부르크 왕관 거부"
  HSP_spain_events.26.desc:0 "[From.GetNameDef] 정부가 우리 국왕의 요구를 거부했습니다. 왕관은 무력으로 차지해야 할 것입니다."
  HSP_spain_events.26.a:0 "그렇다면 빼앗을 뿐이다."
  HSP_spain_events.28.a:0 "합스부르크가 스웨덴 왕좌에 오른다."
  HSP_accepts_habsburg_crown_tt:0 "스페인의 군사력이 더 강하고, 스페인 육군 병력이 50만 명을 넘음"
  # news
  HSP_spain_news.1.title:0 "[From.GetName] 긴급회의 소집"
  HSP_spain_news.1.desc:0 "극심한 불안정을 겪던 [From.GetName]에서 모두의 예상을 벗어나서 긴급 회의를 소집했습니다. 일부 여론은 긴급회의를 통해서 당장에 닥친 사회적 불안을 해소할 수 있을 것이라 희망적으로 보고 있지만, 대부분은 부질없는 시간 끌기에 불과할 거라는 비관적인 입장을 취하고 있습니다."
