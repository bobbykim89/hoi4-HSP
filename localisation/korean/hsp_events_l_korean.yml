l_korean:
  # events
  HSP_spain_events.5.t:0 "[POR.GetNameDef]과의 통일을 제안한 [SPR.GetNameDef]"
  HSP_spain_events.5.desc:0 "[SPR.GetNameDef]과 [POR.GetNameDef]는 과거 동군연합으로 전 세계의 바다를 지배한 적이 있습니다. 연합왕국을 다시 재건하여 과거의 영광을 재현하자는 제안을 받았습니다."
  HSP_spain_events.5.a:0 "우리는 다시 뭉쳐야 한다."
  HSP_spain_events.5.b:0 "우리는 관심이 없다."
  lar_spain.1.c:0 "긴급 의회에 결정을 맡긴다."
  HSP_spain_events.30.t:0 "스페인의 왕관"
  HSP_spain_events.30.desc:0 "의회는 군주제 복원에 합의했지만, 누가 왕관을 쓸지는 아직 정해지지 않았습니다. 제국의 전성기에 스페인을 다스렸던 합스부르크 왕가와 1931년까지 왕위에 있었던 부르봉 왕가 모두 왕위를 이을 후보를 내세우고 있습니다."
  HSP_spain_events.30.a:0 "오토 폰 합스부르크를 국왕으로 추대한다."
  HSP_spain_events.30.b:0 "알폰소 13세를 복위시킨다."
  HSP_spain_events.30.c:0 "카를 피우스 대공을 국왕으로 추대한다."
  HSP_spain_events.31.t:0 "범 스페인어권 연합으로의 초대"
  HSP_spain_events.31.desc:0 "[From.GetNameDef] 정부가 마드리드의 주도 아래 스페인어권 국가들을 하나로 묶는 범 스페인어권 연합에 우리를 초대했습니다."
  HSP_spain_events.31.a:0 "초대를 수락한다."
  HSP_spain_events.31.b:0 "초대를 거절한다."
  HSP_spain_events.32.t:0 "[From.GetName], 연합에 가입"
  HSP_spain_events.32.desc:0 "[From.GetNameDef] 정부가 우리의 초대를 수락하고 범 스페인어권 연합에 가입했습니다."
  HSP_spain_events.32.a:0 "연합에 온 것을 환영한다."
  HSP_spain_events.33.t:0 "[From.GetName], 초대 거절"
  HSP_spain_events.33.desc:0 "[From.GetNameDef] 정부가 범 스페인어권 연합으로의 초대를 거절했습니다."
  HSP_spain_events.33.a:0 "그들의 손해다."
  HSP_spain_events.24.t:0 "합스부르크의 왕관"
  HSP_spain_events.24.desc:0 "스페인 국왕이자 합스부르크 왕가의 수장인 [From.GetLeader]께서 [Root.GetNameDef]의 왕관을 정당한 상속권으로서 요구해 왔습니다. 이를 받아들이면 [Root.GetNameDef]는 스페인 왕관 아래의 제국 영지가 됩니다."
  HSP_spain_events.24.a:0 "국왕 폐하 만세."
  HSP_spain_events.24.b:0 "마드리드에 굴복할 수 없다."
  HSP_spain_events.25.t:0 "[From.GetName], 합스부르크 왕관 수락"
  HSP_spain_events.25.desc:0 "[From.GetNameDef] 정부가 우리 국왕을 군주로 받아들였으며, 이제 스페인 왕관 아래의 제국 영지가 됩니다."
  HSP_spain_events.25.a:0 "제국이 다시 커져간다."
  HSP_spain_events.26.t:0 "[From.GetName], 합스부르크 왕관 거부"
  HSP_spain_events.26.desc:0 "[From.GetNameDef] 정부가 우리 국왕의 요구를 거부했습니다. 왕관은 무력으로 차지해야 할 것입니다."
  HSP_spain_events.26.a:0 "그렇다면 빼앗을 뿐이다."
  HSP_spain_events.28.a:0 "합스부르크가 스웨덴 왕좌에 오른다."
  HSP_accepts_habsburg_crown_tt:0 "스페인의 군사력이 더 강하고, 스페인 육군 병력이 50만 명을 넘음"
  HSP_spain_events.34.t:0 "프랑스의 왕관"
  HSP_spain_events.34.desc:0 "스페인의 부르봉 국왕 [From.GetLeader]께서 부르봉 왕가의 정통 계승자로서 프랑스의 왕관을 요구해 왔습니다. 거리는 왕당파 선동가들로 가득하며, 정부는 그를 받아들일지 저항할지 결정해야 합니다."
  HSP_spain_events.34.a:0 "국왕을 받아들인다."
  HSP_spain_events.34.b:0 "프랑스는 공화국으로 남을 것이다!"
  HSP_french_royalist_uprising_tt:0 "왕당파가 정부에 맞서 내전을 일으킵니다."
  HSP_spain_events.35.t:0 "프랑스, 우리 국왕을 받아들이다"
  HSP_spain_events.35.desc:0 "[From.GetNameDef] 정부가 우리 국왕을 군주로 받아들였습니다. 이제 두 왕관이 한 사람의 머리 위에 놓였습니다."
  HSP_spain_events.35.a:0 "국왕 만세!"
  HSP_spain_events.36.t:0 "프랑스 왕당파 봉기"
  HSP_spain_events.36.desc:0 "[From.GetNameDef] 정부가 우리 국왕의 요구를 거부했습니다. 왕당파가 공화국에 맞서 무기를 들었으며, 우리는 그들과 함께합니다."
  HSP_spain_events.36.a:0 "무기를 들어라!"
  HSP_spain_events.37.t:0 "스페인의 루이지애나 반환 요구"
  HSP_spain_events.37.desc:0 "이제 프랑스 왕관의 계승자이기도 한 [From.GetNameDef] 정부가 1803년 우리에게 매각된 옛 프랑스령 루이지애나의 반환을 요구해 왔습니다."
  HSP_spain_events.37.a:0 "받아들일 수밖에 없다."
  HSP_spain_events.37.b:0 "절대 불가하다."
  HSP_spain_events.38.t:0 "[From.GetName], 루이지애나 할양"
  HSP_spain_events.38.desc:0 "[From.GetNameDef] 정부가 옛 루이지애나 지역을 넘겨주는 데 동의했습니다."
  HSP_spain_events.38.a:0 "훌륭하다."
  HSP_spain_events.39.t:0 "[From.GetName], 루이지애나 할양 거부"
  HSP_spain_events.39.desc:0 "[From.GetNameDef] 정부가 우리의 요구를 거부했습니다. 루이지애나는 무력으로 되찾아야 할 것입니다."
  HSP_spain_events.39.a:0 "그렇게 하자."
  HSP_spain_events.40.t:0 "라틴 권역으로의 초대"
  HSP_spain_events.40.desc:0 "스페인 공화국이 마드리드를 중심으로 스페인어권의 자유 국가들이 뭉친 동맹, 라틴 권역에 우리를 초대했습니다."
  HSP_spain_events.40.a:0 "초대를 수락한다."
  HSP_spain_events.40.b:0 "초대를 거절한다."
  HSP_spain_events.41.t:0 "[From.GetName], 라틴 권역 가입"
  HSP_spain_events.41.desc:0 "[From.GetNameDef] 정부가 우리의 초대를 수락하고 라틴 권역에 가입했습니다."
  HSP_spain_events.41.a:0 "환영한다, 벗들이여."
  HSP_spain_events.42.t:0 "[From.GetName], 초대 거절"
  HSP_spain_events.42.desc:0 "[From.GetNameDef] 정부가 라틴 권역으로의 초대를 거절했습니다."
  HSP_spain_events.42.a:0 "다음 기회에."
  HSP_spain_events.6.t:0 "[From.GetName], 통합 수락"
  HSP_spain_events.6.desc:0 "[From.GetNameDef] 정부가 우리의 제안을 받아들였습니다. 옛 합스부르크 국왕들의 시대처럼, 이베리아 반도의 두 왕관이 다시 하나가 되었습니다."
  HSP_spain_events.6.a:0 "이베리아가 다시 하나가 되었다."
  HSP_spain_events.7.t:0 "[From.GetName], 통합 거부"
  HSP_spain_events.7.desc:0 "[From.GetNameDef] 정부가 이베리아 왕관의 통합을 복원하자는 우리의 제안을 거부했습니다. 리스본은 마드리드와 운명을 함께하기보다 독립을 택했습니다."
  HSP_spain_events.7.a:0 "유감이지만 그들의 결정을 존중하겠다."
  HSP_spain_events.7.b:0 "거절은 받아들일 수 없다."
  HSP_spain_events.8.t:0 "스페인의 동군연합 제안"
  HSP_spain_events.8.desc:0 "[From.GetNameDef] 정부가 우리나라가 스페인 왕관 아래 동군연합을 이루자고 제안해 왔습니다. 한때 포르투갈 세계와 스페인 세계를 잇던 유대를 되살리자는 것으로, 마드리드는 보호와 왕국 내의 명예로운 지위를 약속하고 있습니다."
  HSP_spain_events.8.a:0 "스페인의 왕관을 받아들인다."
  HSP_spain_events.8.b:0 "브라질은 외국의 국왕을 섬기지 않는다."
  HSP_spain_events.9.t:0 "[From.GetName], 동군연합 수락"
  HSP_spain_events.9.desc:0 "[From.GetNameDef] 정부가 우리 국왕을 군주로 받아들이고 스페인과 동군연합을 이루었습니다."
  HSP_spain_events.9.a:0 "대서양을 아우르는 왕관이다."
  HSP_spain_events.10.t:0 "[From.GetName], 동군연합 거부"
  HSP_spain_events.10.desc:0 "[From.GetNameDef] 정부가 우리의 제안을 거부했습니다. 브라질이 스스로 오지 않는다면, 무력으로 왕관 아래 두어야 할 것입니다."
  HSP_spain_events.10.a:0 "그렇게 하자."
  HSP_spain_events.11.t:0 "스페인의 스페인어권 단결 호소"
  HSP_spain_events.11.desc:0 "[From.GetNameDef] 정부가 아메리카의 스페인어권 국가들에게 공통의 언어와 신앙, 역사를 내세우며 단결할 것을 호소했습니다. 우리나라에서도 많은 이들이 이 호소를 반기고 있습니다."
  HSP_spain_events.11.a:0 "우리는 같은 유산을 공유한다."
  HSP_spain_events.12.t:0 "스페인의 복속 요구"
  HSP_spain_events.12.desc:0 "범 스페인어권 연합의 맹주인 [From.GetNameDef] 정부가 우리에게 그 권위 아래로 들어올 것을 요구해 왔습니다. 이를 받아들이면 스페인의 보호와 투자를 얻겠지만, 독립을 잃게 됩니다."
  HSP_spain_events.12.a:0 "스페인의 권위를 받아들인다."
  HSP_spain_events.12.b:0 "우리는 독립을 지킬 것이다."
  HSP_spain_events.13.t:0 "[From.GetName], 복속 수락"
  HSP_spain_events.13.desc:0 "[From.GetNameDef] 정부가 우리의 권위를 받아들여 우리의 종속국이 되었습니다."
  HSP_spain_events.13.a:0 "훌륭하다."
  HSP_spain_events.14.t:0 "[From.GetName], 복속 거부"
  HSP_spain_events.14.desc:0 "[From.GetNameDef] 정부가 우리의 요구를 거부하고 연합 안에서 독립을 유지하겠다고 고집하고 있습니다."
  HSP_spain_events.14.a:0 "다음 기회에 다시 요구하겠다."
  HSP_spain_events.14.b:0 "그렇다면 그들은 연합에 있을 자격이 없다."
  HSP_spain_events.14.a_cooldown_tt:0 "당장은 아무 일도 일어나지 않으며, 나중에 다시 요구할 수 있습니다."
  HSP_spain_events.15.t:0 "스페인의 라틴아메리카 영토 매입 제안"
  HSP_spain_events.15.desc:0 "[From.GetNameDef] 정부가 영국령 온두라스, 바하마, 자메이카, 트리니다드, 영국령 기아나를 매입하겠다고 제안해 왔습니다. 이 식민지들은 유지 비용이 많이 들며, 마드리드의 제안은 후한 편입니다."
  HSP_spain_events.15.a:0 "제안을 받아들인다."
  HSP_spain_events.15.b:0 "제국은 팔 물건이 아니다."
  HSP_spain_events.16.t:0 "[From.GetName], 라틴아메리카 영토 매각"
  HSP_spain_events.16.desc:0 "[From.GetNameDef] 정부가 우리의 제안을 받아들였습니다. 중앙아메리카와 카리브해의 식민지들은 이제 우리의 것입니다."
  HSP_spain_events.16.a:0 "좋은 거래였다."
  HSP_spain_events.17.t:0 "[From.GetName], 매각 거부"
  HSP_spain_events.17.desc:0 "[From.GetNameDef] 정부가 아메리카 식민지를 매입하겠다는 우리의 제안을 거부했습니다."
  HSP_spain_events.17.a:0 "아쉽군."
  HSP_spain_events.18.t:0 "스페인의 수리남·퀴라소 매입 제안"
  HSP_spain_events.18.desc:0 "[From.GetNameDef] 정부가 수리남과 퀴라소를 매입하겠다고 제안해 왔습니다. 이 식민지들은 본국에서 멀리 떨어져 있으며, 마드리드의 제안은 후한 편입니다."
  HSP_spain_events.18.a:0 "제안을 받아들인다."
  HSP_spain_events.18.b:0 "식민지를 지키겠다."
  HSP_spain_events.19.t:0 "[From.GetName], 수리남·퀴라소 매각"
  HSP_spain_events.19.desc:0 "[From.GetNameDef] 정부가 우리의 제안을 받아들였습니다. 수리남과 퀴라소는 이제 우리의 것입니다."
  HSP_spain_events.19.a:0 "좋은 거래였다."
  HSP_spain_events.20.t:0 "[From.GetName], 매각 거부"
  HSP_spain_events.20.desc:0 "[From.GetNameDef] 정부가 수리남과 퀴라소를 매입하겠다는 우리의 제안을 거부했습니다."
  HSP_spain_events.20.a:0 "아쉽군."
  HSP_spain_events.21.t:0 "스페인의 잃어버린 영토 반환 요구"
  HSP_spain_events.21.desc:0 "[From.GetNameDef] 정부가 플로리다와 푸에르토리코, 그리고 남서부의 옛 스페인 영토가 스페인 왕관과 그 계승자들로부터 빼앗긴 땅이라며 반환을 요구해 왔습니다."
  HSP_spain_events.21.a:0 "이 문제로 전쟁을 무릅쓸 수는 없다."
  HSP_spain_events.21.b:0 "터무니없다. 거부한다."
  HSP_spain_events.22.t:0 "[From.GetName], 잃어버린 영토 반환"
  HSP_spain_events.22.desc:0 "[From.GetNameDef] 정부가 우리의 요구에 동의했습니다. 플로리다와 푸에르토리코, 그리고 남서부가 스페인어권 세계로 돌아왔습니다."
  HSP_spain_events.22.a:0 "마침내 정의가 이루어졌다."
  HSP_spain_events.23.t:0 "[From.GetName], 요구 거부"
  HSP_spain_events.23.desc:0 "[From.GetNameDef] 정부가 우리의 요구를 거부했습니다. 잃어버린 영토는 무력으로 되찾아야 할 것입니다."
  HSP_spain_events.23.a:0 "그렇다면 되찾을 뿐이다."
  HSP_spain_events.27.t:0 "스페인의 보호 제안"
  HSP_spain_events.27.desc:0 "[From.GetNameDef] 정부가 우리 왕국을 보호하겠다고 제안해 왔습니다. 그 대가로 합스부르크 왕가의 왕자가 스웨덴 왕위에 오르게 됩니다."
  HSP_spain_events.27.a:0 "스페인의 보호를 받아들인다."
  HSP_spain_events.27.b:0 "스웨덴은 홀로 설 것이다."
  HSP_spain_events.28.t:0 "[From.GetName], 보호 수락"
  HSP_spain_events.28.desc:0 "[From.GetNameDef] 정부가 우리의 보호를 받아들였으며, 이제 합스부르크 왕자가 스웨덴 왕위에 올랐습니다."
  HSP_spain_events.29.t:0 "[From.GetName], 보호 거부"
  HSP_spain_events.29.desc:0 "[From.GetNameDef] 정부가 우리의 제안을 거부했습니다. 스웨덴이 우리의 보호를 받아들이지 않는다면, 우리의 지배를 받아들여야 할 것입니다."
  HSP_spain_events.29.a:0 "그렇게 하자."
  # news
  HSP_spain_news.1.title:0 "[From.GetName] 긴급회의 소집"
  HSP_spain_news.1.desc:0 "극심한 불안정을 겪던 [From.GetName]에서 모두의 예상을 벗어나서 긴급 회의를 소집했습니다. 일부 여론은 긴급회의를 통해서 당장에 닥친 사회적 불안을 해소할 수 있을 것이라 희망적으로 보고 있지만, 대부분은 부질없는 시간 끌기에 불과할 거라는 비관적인 입장을 취하고 있습니다."
  HSP_spain_news.1.a:0 "우리는 서로의 차이를 조율해야 한다."
  HSP_spain_news.1.b:0 "흥미롭군."
  HSP_spain_news.2.title:0 "스페인에서 군부 봉기 발생"
  HSP_spain_news.2.desc:0 "스페인군의 장군들이 공화국 정부에 맞서 봉기했습니다. 북부와 모로코 전역의 주둔군이 반란군 편에 섰고, 공화국은 충성스러운 노동자들을 무장시켜 나머지 국토를 지키고 있습니다. 스페인은 스스로와 전쟁을 벌이고 있습니다."
  HSP_spain_news.2.a:0 "그들은 지나가지 못한다!"
  HSP_spain_news.2.b:0 "스페인이 또다시 피를 흘리는군."
  HSP_spain_news.3.title:0 "스페인 공화국, 파시스트의 음모를 분쇄하다"
  HSP_spain_news.3.desc:0 "[From.GetNameDef] 정부가 장군들과 팔랑헤 당원들의 음모를 거사 직전에 분쇄했습니다. 음모자들은 체포되거나 해임되었으며, 공화국은 가장 위험했던 한 해를 피를 흘리지 않고 넘긴 것으로 보입니다."
  HSP_spain_news.3.a:0 "공화국은 건재하다."
  HSP_spain_news.3.b:0 "아슬아슬했군."
  HSP_spain_news.4.title:0 "스페인 공화국의 승리"
  HSP_spain_news.4.desc:0 "군부 반란의 마지막 거점들이 함락되었습니다. 치열한 전쟁 끝에 [From.GetNameDef]은(는) 전 국토에 대한 권위를 되찾았으며, 반란을 일으킨 장군들은 죽거나 붙잡히거나 망명길에 올랐습니다."
  HSP_spain_news.4.a:0 "스페인은 자유롭다."
  HSP_spain_news.4.b:0 "반란은 실패했군."
