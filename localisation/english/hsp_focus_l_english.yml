  # starting focus
  HSP_assemble_emergency_council:0 "Assemble the Emergency Council"
  HSP_assemble_emergency_council_desc:0 "The factions within our nation are at each other's throats, and if the elections go ahead as planned, a backlash from the discontented is all but certain. The current government lacks the means to mediate between them. Reluctant as we are, we must convene an emergency council to reconcile the opinions and demands of every part of society."
  HSP_gain_public_support:0 "Gain Public Support"
  HSP_gain_public_support_desc:0 "As expected, the representatives of each camp have no intention of yielding, and the emergency council's progress has stalled. Only the workers' organizations appear to leave some room for compromise."
  HSP_ensure_military_loyalty:0 "Ensure Military Loyalty"
  HSP_ensure_military_loyalty_desc:0 "Thanks to the concessions of the workers' organizations, discontent within the military has also subsided considerably. If some compromise can be reached with them as well, they too are expected to return to their posts."
  HSP_martial_law_for_stability:0 "Martial Law for Stability"
  HSP_martial_law_for_stability_desc:0 "Even as negotiations continue, some radicals keep up their campaign of terror outside the council chamber. We must round them up in one sweep and bring the situation under control."
  HSP_new_monarchy:0 "A New Monarchy"
  HSP_new_monarchy_desc:0 "The Carlists have long questioned the dubious legitimacy of Alfonso XIII, yet public opposition is far too strong to accept the Carlist claim. While the council was debating the election of a new king, an unexpected figure was put forward."
