l_english:
  # events
  HSP_spain_events.5.t:0 "[SPR.GetNameDef] Proposes Unification with [POR.GetNameDef]"
  HSP_spain_events.5.desc:0 "[SPR.GetNameDef] and [POR.GetNameDef] once ruled the oceans of the world together as a personal union. We have received a proposal to rebuild that united kingdom and revive the glory of the past."
  HSP_spain_events.5.a:0 "We must stand together once more."
  HSP_spain_events.5.b:0 "We are not interested."
  lar_spain.1.c:0 "Let the emergency council decide."
  HSP_spain_events.30.t:0 "The Crown of Spain"
  HSP_spain_events.30.desc:0 "The council has agreed to restore the monarchy, but who will wear the crown is still undecided. The House of Habsburg, which ruled Spain at the height of its empire, and the House of Borbón, which reigned until 1931, both have a claimant ready to take the throne."
  HSP_spain_events.30.a:0 "Otto von Habsburg shall be our king."
  HSP_spain_events.30.b:0 "Restore Alfonso XIII to the throne."
  HSP_spain_events.30.c:0 "Crown Archduke Karl Pius."
  HSP_spain_events.31.t:0 "Invitation to the Pan-Hispanic Federation"
  HSP_spain_events.31.desc:0 "[From.GetNameDef] has invited us to join the Pan-Hispanic Federation, which unites the Spanish-speaking nations under the leadership of Madrid."
  HSP_spain_events.31.a:0 "We accept."
  HSP_spain_events.31.b:0 "We decline."
  HSP_spain_events.32.t:0 "[From.GetName] Joins the Federation"
  HSP_spain_events.32.desc:0 "[From.GetNameDef] has accepted our invitation and joined the Pan-Hispanic Federation."
  HSP_spain_events.32.a:0 "Welcome to the Federation."
  HSP_spain_events.33.t:0 "[From.GetName] Refuses"
  HSP_spain_events.33.desc:0 "[From.GetNameDef] has declined our invitation to the Pan-Hispanic Federation."
  HSP_spain_events.33.a:0 "Their loss."
  HSP_spain_events.24.t:0 "The Habsburg Crown"
  HSP_spain_events.24.desc:0 "[From.GetLeader], King of Spain and head of the House of Habsburg, has claimed the crown of [Root.GetNameDef] as his rightful inheritance. If we accept, [Root.GetNameDef] will become an imperial dominion under the Spanish crown."
  HSP_spain_events.24.a:0 "Long live the King."
  HSP_spain_events.24.b:0 "We will not bow to Madrid."
  HSP_spain_events.25.t:0 "[From.GetName] Accepts the Habsburg Crown"
  HSP_spain_events.25.desc:0 "[From.GetNameDef] has accepted our king as its sovereign and becomes an imperial dominion of the Spanish crown."
  HSP_spain_events.25.a:0 "The empire grows once more."
  HSP_spain_events.26.t:0 "[From.GetName] Rejects the Habsburg Crown"
  HSP_spain_events.26.desc:0 "[From.GetNameDef] has refused our king's claim. The crown will have to be taken by force."
  HSP_spain_events.26.a:0 "Then we shall take it."
  HSP_spain_events.28.a:0 "A Habsburg sits on the Swedish throne."
  HSP_accepts_habsburg_crown_tt:0 "Spain's army is stronger, and Spain fields more than 500,000 men"
  HSP_spain_events.34.t:0 "The Crown of France"
  HSP_spain_events.34.desc:0 "[From.GetLeader], the Borbón King of Spain, has laid claim to the crown of France as the senior heir of the House of Bourbon. Royalist agitators fill the streets, and the government must decide whether to accept him or resist."
  HSP_spain_events.34.a:0 "Accept the King."
  HSP_spain_events.34.b:0 "France will remain a republic!"
  HSP_french_royalist_uprising_tt:0 "The royalists rise against the government in a civil war."
  HSP_spain_events.35.t:0 "France Accepts Our King"
  HSP_spain_events.35.desc:0 "[From.GetNameDef] has accepted our king as its sovereign. Both crowns now rest on a single head."
  HSP_spain_events.35.a:0 "Vive le Roi!"
  HSP_spain_events.36.t:0 "The French Royalists Rise"
  HSP_spain_events.36.desc:0 "[From.GetNameDef] has rejected our king's claim. The royalists have taken up arms against the republic, and we stand with them."
  HSP_spain_events.36.a:0 "To arms!"
  HSP_spain_events.37.t:0 "Spain Demands Louisiana"
  HSP_spain_events.37.desc:0 "[From.GetNameDef], now heir to the French crown as well, demands the return of the lands of old French Louisiana, sold to us in 1803."
  HSP_spain_events.37.a:0 "We have no choice but to agree."
  HSP_spain_events.37.b:0 "Never."
  HSP_spain_events.38.t:0 "[From.GetName] Cedes Louisiana"
  HSP_spain_events.38.desc:0 "[From.GetNameDef] has agreed to hand over the lands of old Louisiana."
  HSP_spain_events.38.a:0 "Excellent."
  HSP_spain_events.39.t:0 "[From.GetName] Refuses to Cede Louisiana"
  HSP_spain_events.39.desc:0 "[From.GetNameDef] has rejected our demand. Louisiana will have to be taken by force."
  HSP_spain_events.39.a:0 "So be it."
  # news
  HSP_spain_news.1.title:0 "[From.GetName] Convenes an Emergency Council"
  HSP_spain_news.1.desc:0 "Defying all expectations, the deeply unstable [From.GetName] has convened an emergency council. Some observers hope the council can ease the social unrest the country now faces, but most take a pessimistic view, dismissing it as nothing more than a futile attempt to buy time."
