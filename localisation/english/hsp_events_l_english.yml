l_english:
  # events
  HSP_spain_events.5.t:0 "[SPR.GetNameDef] Proposes Unification with [POR.GetNameDef]"
  HSP_spain_events.5.desc:0 "[SPR.GetNameDef] and [POR.GetNameDef] once ruled the oceans of the world together as a personal union. We have received a proposal to rebuild that united kingdom and revive the glory of the past."
  HSP_spain_events.5.a:0 "We must stand together once more."
  HSP_spain_events.5.b:0 "We are not interested."
  lar_spain.1.c:0 "Let the emergency council decide."
  HSP_spain_events.30.t:0 "The Crown of Spain"
  HSP_spain_events.30.desc:0 "The council has agreed to restore the monarchy, but who will wear the crown is still undecided. The House of Habsburg, which ruled Spain at the height of its empire, and the House of Borbón, which reigned until 1931, both have a claimant ready to take the throne."
  HSP_spain_events.30.a:0 "Otto von Habsburg shall be our king."
  HSP_spain_events.30.b:0 "Restore Alfonso XIII to the throne."
  HSP_spain_events.30.c:0 "Crown Archduke Karl Pius."
  HSP_spain_events.31.t:0 "Invitation to the Pan-Hispanic Federation"
  HSP_spain_events.31.desc:0 "[From.GetNameDef] has invited us to join the Pan-Hispanic Federation, which unites the Spanish-speaking nations under the leadership of Madrid."
  HSP_spain_events.31.a:0 "We accept."
  HSP_spain_events.31.b:0 "We decline."
  HSP_spain_events.32.t:0 "[From.GetName] Joins the Federation"
  HSP_spain_events.32.desc:0 "[From.GetNameDef] has accepted our invitation and joined the Pan-Hispanic Federation."
  HSP_spain_events.32.a:0 "Welcome to the Federation."
  HSP_spain_events.33.t:0 "[From.GetName] Refuses"
  HSP_spain_events.33.desc:0 "[From.GetNameDef] has declined our invitation to the Pan-Hispanic Federation."
  HSP_spain_events.33.a:0 "Their loss."
  HSP_spain_events.24.t:0 "The Habsburg Crown"
  HSP_spain_events.24.desc:0 "[From.GetLeader], King of Spain and head of the House of Habsburg, has claimed the crown of [Root.GetNameDef] as his rightful inheritance. If we accept, [Root.GetNameDef] will become an imperial dominion under the Spanish crown."
  HSP_spain_events.24.a:0 "Long live the King."
  HSP_spain_events.24.b:0 "We will not bow to Madrid."
  HSP_spain_events.25.t:0 "[From.GetName] Accepts the Habsburg Crown"
  HSP_spain_events.25.desc:0 "[From.GetNameDef] has accepted our king as its sovereign and becomes an imperial dominion of the Spanish crown."
  HSP_spain_events.25.a:0 "The empire grows once more."
  HSP_spain_events.26.t:0 "[From.GetName] Rejects the Habsburg Crown"
  HSP_spain_events.26.desc:0 "[From.GetNameDef] has refused our king's claim. The crown will have to be taken by force."
  HSP_spain_events.26.a:0 "Then we shall take it."
  HSP_spain_events.28.a:0 "A Habsburg sits on the Swedish throne."
  HSP_accepts_habsburg_crown_tt:0 "Spain's army is stronger, and Spain fields more than 500,000 men"
  HSP_spain_events.34.t:0 "The Crown of France"
  HSP_spain_events.34.desc:0 "[From.GetLeader], the Borbón King of Spain, has laid claim to the crown of France as the senior heir of the House of Bourbon. Royalist agitators fill the streets, and the government must decide whether to accept him or resist."
  HSP_spain_events.34.a:0 "Accept the King."
  HSP_spain_events.34.b:0 "France will remain a republic!"
  HSP_french_royalist_uprising_tt:0 "The royalists rise against the government in a civil war."
  HSP_spain_events.35.t:0 "France Accepts Our King"
  HSP_spain_events.35.desc:0 "[From.GetNameDef] has accepted our king as its sovereign. Both crowns now rest on a single head."
  HSP_spain_events.35.a:0 "Vive le Roi!"
  HSP_spain_events.36.t:0 "The French Royalists Rise"
  HSP_spain_events.36.desc:0 "[From.GetNameDef] has rejected our king's claim. The royalists have taken up arms against the republic, and we stand with them."
  HSP_spain_events.36.a:0 "To arms!"
  HSP_spain_events.37.t:0 "Spain Demands Louisiana"
  HSP_spain_events.37.desc:0 "[From.GetNameDef], now heir to the French crown as well, demands the return of the lands of old French Louisiana, sold to us in 1803."
  HSP_spain_events.37.a:0 "We have no choice but to agree."
  HSP_spain_events.37.b:0 "Never."
  HSP_spain_events.38.t:0 "[From.GetName] Cedes Louisiana"
  HSP_spain_events.38.desc:0 "[From.GetNameDef] has agreed to hand over the lands of old Louisiana."
  HSP_spain_events.38.a:0 "Excellent."
  HSP_spain_events.39.t:0 "[From.GetName] Refuses to Cede Louisiana"
  HSP_spain_events.39.desc:0 "[From.GetNameDef] has rejected our demand. Louisiana will have to be taken by force."
  HSP_spain_events.39.a:0 "So be it."
  HSP_spain_events.40.t:0 "Invitation to the Latin Sphere"
  HSP_spain_events.40.desc:0 "The Spanish Republic has invited us to join the Latin Sphere, an alliance of the free nations of the Hispanic world led from Madrid."
  HSP_spain_events.40.a:0 "We accept."
  HSP_spain_events.40.b:0 "We decline."
  HSP_spain_events.41.t:0 "[From.GetName] Joins the Latin Sphere"
  HSP_spain_events.41.desc:0 "[From.GetNameDef] has accepted our invitation and joined the Latin Sphere."
  HSP_spain_events.41.a:0 "Welcome, friends."
  HSP_spain_events.42.t:0 "[From.GetName] Refuses"
  HSP_spain_events.42.desc:0 "[From.GetNameDef] has declined our invitation to the Latin Sphere."
  HSP_spain_events.42.a:0 "Perhaps another time."
  HSP_spain_events.43.t:0 "Spain Proposes an Iberian Pact"
  HSP_spain_events.43.desc:0 "[From.GetNameDef] invites us to stand with it in defence of the Iberian peninsula. Our neighbour assures us that the pact threatens no one and that Lisbon would be an equal partner."
  HSP_spain_events.43.a:0 "Iberia stands together."
  HSP_spain_events.43.b:0 "Portugal keeps its own counsel."
  HSP_spain_events.44.t:0 "Portugal Joins Us"
  HSP_spain_events.44.desc:0 "[From.GetNameDef] has accepted our invitation. The whole peninsula now stands together."
  HSP_spain_events.44.a:0 "Welcome, neighbour."
  HSP_spain_events.45.t:0 "Portugal Refuses"
  HSP_spain_events.45.desc:0 "[From.GetNameDef] has declined our invitation, preferring to keep its old commitments."
  HSP_spain_events.45.a:0 "A pity."
  HSP_spain_events.46.t:0 "Spain Proposes a Socialist Union"
  HSP_spain_events.46.desc:0 "The communist government of [From.GetNameDef] proposes that our two revolutions unite in a single Iberian socialist state."
  HSP_spain_events.46.a:0 "Workers of Iberia, unite!"
  HSP_spain_events.46.b:0 "Portugal's revolution is its own."
  HSP_spain_events.47.t:0 "Portugal Accepts the Union"
  HSP_spain_events.47.desc:0 "[From.GetNameDef] has accepted our proposal. The Iberian revolution is one."
  HSP_spain_events.47.a:0 "Forward, together."
  HSP_spain_events.48.t:0 "Portugal Refuses the Union"
  HSP_spain_events.48.desc:0 "[From.GetNameDef] has rejected our proposal of a socialist union."
  HSP_spain_events.48.a:0 "Then the revolution will decide."
  HSP_spain_events.49.t:0 "Spain Invites Us"
  HSP_spain_events.49.desc:0 "The workers' state of [From.GetNameDef] invites us to stand with it in the struggle against fascism and capital."
  HSP_spain_events.49.a:0 "We stand with Spain."
  HSP_spain_events.49.b:0 "We decline."
  HSP_spain_events.50.t:0 "[From.GetName] Joins Us"
  HSP_spain_events.50.desc:0 "[From.GetNameDef] has accepted our invitation."
  HSP_spain_events.50.a:0 "Welcome, comrades."
  HSP_spain_events.51.t:0 "[From.GetName] Refuses"
  HSP_spain_events.51.desc:0 "[From.GetNameDef] has declined our invitation."
  HSP_spain_events.51.a:0 "Their loss."
  HSP_spain_events.52.t:0 "Spain Demands Our Submission"
  HSP_spain_events.52.desc:0 "The Falangist government of [From.GetNameDef] demands that we accept Madrid's authority and join its new empire."
  HSP_spain_events.52.a:0 "We submit."
  HSP_spain_events.52.b:0 "Never!"
  HSP_spain_events.53.t:0 "[From.GetName] Submits"
  HSP_spain_events.53.desc:0 "[From.GetNameDef] has accepted our authority."
  HSP_spain_events.53.a:0 "The empire grows."
  HSP_spain_events.54.t:0 "[From.GetName] Refuses"
  HSP_spain_events.54.desc:0 "[From.GetNameDef] has rejected our demand. It will have to be brought back by force."
  HSP_spain_events.54.a:0 "So be it."
  HSP_spain_events.6.t:0 "[From.GetName] Accepts Unification"
  HSP_spain_events.6.desc:0 "[From.GetNameDef] has accepted our proposal. The two crowns of the Iberian Peninsula are united once more, as they were under the Habsburg kings of old."
  HSP_spain_events.6.a:0 "Iberia is whole again."
  HSP_spain_events.7.t:0 "[From.GetName] Rejects Unification"
  HSP_spain_events.7.desc:0 "[From.GetNameDef] has rejected our proposal to restore the union of the Iberian crowns. Lisbon prefers its independence to a shared destiny with Madrid."
  HSP_spain_events.7.a:0 "Unfortunate, but we will respect their decision."
  HSP_spain_events.7.b:0 "We will not take no for an answer."
  HSP_spain_events.8.t:0 "Spain Proposes a Personal Union"
  HSP_spain_events.8.desc:0 "[From.GetNameDef] proposes that our nation enter a personal union under the Spanish crown, reviving the ties that once bound the Portuguese and Spanish worlds. Madrid promises protection and a place of honour within its realm."
  HSP_spain_events.8.a:0 "We accept the Spanish crown."
  HSP_spain_events.8.b:0 "Brazil answers to no foreign king."
  HSP_spain_events.9.t:0 "[From.GetName] Enters a Personal Union"
  HSP_spain_events.9.desc:0 "[From.GetNameDef] has accepted our king as its sovereign and enters a personal union with Spain."
  HSP_spain_events.9.a:0 "A crown that spans the Atlantic."
  HSP_spain_events.10.t:0 "[From.GetName] Refuses the Personal Union"
  HSP_spain_events.10.desc:0 "[From.GetNameDef] has refused our offer. If Brazil will not come to us willingly, it will have to be brought under the crown by force."
  HSP_spain_events.10.a:0 "So be it."
  HSP_spain_events.11.t:0 "Spain Calls for Hispanic Unity"
  HSP_spain_events.11.desc:0 "[From.GetNameDef] has called on the Spanish-speaking nations of the Americas to stand together, invoking the language, faith and history they share. Many in our country have welcomed the call."
  HSP_spain_events.11.a:0 "We share a common heritage."
  HSP_spain_events.12.t:0 "Spain Demands Our Submission"
  HSP_spain_events.12.desc:0 "[From.GetNameDef], the leader of the Pan-Hispanic Federation, demands that we place ourselves under its authority. Accepting would bring us Spanish protection and investment, at the cost of our independence."
  HSP_spain_events.12.a:0 "We accept Spanish authority."
  HSP_spain_events.12.b:0 "We will remain independent."
  HSP_spain_events.13.t:0 "[From.GetName] Submits"
  HSP_spain_events.13.desc:0 "[From.GetNameDef] has accepted our authority and becomes our subject."
  HSP_spain_events.13.a:0 "Excellent."
  HSP_spain_events.14.t:0 "[From.GetName] Refuses to Submit"
  HSP_spain_events.14.desc:0 "[From.GetNameDef] has refused our demand and insists on remaining independent within the federation."
  HSP_spain_events.14.a:0 "We will ask again another time."
  HSP_spain_events.14.b:0 "Then they have no place in the federation."
  HSP_spain_events.14.a_cooldown_tt:0 "Nothing changes for now; the demand can be made again later."
  HSP_spain_events.15.t:0 "Spain Offers to Buy Our Latin American Territories"
  HSP_spain_events.15.desc:0 "[From.GetNameDef] has offered to purchase British Honduras, the Bahamas, Jamaica, Trinidad and British Guiana. The colonies are costly to maintain, and Madrid's offer is generous."
  HSP_spain_events.15.a:0 "Accept the offer."
  HSP_spain_events.15.b:0 "The Empire is not for sale."
  HSP_spain_events.16.t:0 "[From.GetName] Sells Its Latin American Territories"
  HSP_spain_events.16.desc:0 "[From.GetNameDef] has accepted our offer. Its colonies in Central America and the Caribbean are now ours."
  HSP_spain_events.16.a:0 "A fine bargain."
  HSP_spain_events.17.t:0 "[From.GetName] Refuses to Sell"
  HSP_spain_events.17.desc:0 "[From.GetNameDef] has rejected our offer to purchase its colonies in the Americas."
  HSP_spain_events.17.a:0 "A pity."
  HSP_spain_events.18.t:0 "Spain Offers to Buy Suriname and Curaçao"
  HSP_spain_events.18.desc:0 "[From.GetNameDef] has offered to purchase Suriname and Curaçao. The colonies are far from home, and Madrid's offer is generous."
  HSP_spain_events.18.a:0 "Accept the offer."
  HSP_spain_events.18.b:0 "We will keep our colonies."
  HSP_spain_events.19.t:0 "[From.GetName] Sells Suriname and Curaçao"
  HSP_spain_events.19.desc:0 "[From.GetNameDef] has accepted our offer. Suriname and Curaçao are now ours."
  HSP_spain_events.19.a:0 "A fine bargain."
  HSP_spain_events.20.t:0 "[From.GetName] Refuses to Sell"
  HSP_spain_events.20.desc:0 "[From.GetNameDef] has rejected our offer to purchase Suriname and Curaçao."
  HSP_spain_events.20.a:0 "A pity."
  HSP_spain_events.21.t:0 "Spain Demands Its Lost Territories"
  HSP_spain_events.21.desc:0 "[From.GetNameDef] demands the return of Florida, Puerto Rico and the former Spanish lands of the Southwest, which it claims were taken from the Spanish crown and its heirs."
  HSP_spain_events.21.a:0 "We cannot risk war over this."
  HSP_spain_events.21.b:0 "Absurd. We refuse."
  HSP_spain_events.22.t:0 "[From.GetName] Returns Our Lost Territories"
  HSP_spain_events.22.desc:0 "[From.GetNameDef] has agreed to our demand. Florida, Puerto Rico and the Southwest return to the Hispanic world."
  HSP_spain_events.22.a:0 "Justice at last."
  HSP_spain_events.23.t:0 "[From.GetName] Refuses Our Demand"
  HSP_spain_events.23.desc:0 "[From.GetNameDef] has rejected our demand. Our lost territories will have to be reclaimed by force."
  HSP_spain_events.23.a:0 "Then we will take them back."
  HSP_spain_events.27.t:0 "Spain Offers Its Protection"
  HSP_spain_events.27.desc:0 "[From.GetNameDef] offers to take our kingdom under its protection. In return, a prince of the House of Habsburg would ascend the Swedish throne."
  HSP_spain_events.27.a:0 "Accept Spanish protection."
  HSP_spain_events.27.b:0 "Sweden will stand alone."
  HSP_spain_events.28.t:0 "[From.GetName] Accepts Our Protection"
  HSP_spain_events.28.desc:0 "[From.GetNameDef] has accepted our protection, and a Habsburg prince now sits on the Swedish throne."
  HSP_spain_events.29.t:0 "[From.GetName] Refuses Our Protection"
  HSP_spain_events.29.desc:0 "[From.GetNameDef] has rejected our offer. If Sweden will not accept our protection, it will have to accept our rule."
  HSP_spain_events.29.a:0 "So be it."
  # news
  HSP_spain_news.1.title:0 "[From.GetName] Convenes an Emergency Council"
  HSP_spain_news.1.desc:0 "Defying all expectations, the deeply unstable [From.GetName] has convened an emergency council. Some observers hope the council can ease the social unrest the country now faces, but most take a pessimistic view, dismissing it as nothing more than a futile attempt to buy time."
  HSP_spain_news.1.a:0 "We must reconcile our differences."
  HSP_spain_news.1.b:0 "Interesting."
  HSP_spain_news.2.title:0 "Military Uprising in Spain"
  HSP_spain_news.2.desc:0 "Generals of the Spanish army have risen against the government of the Republic. Garrisons across the north and in Morocco have declared for the rebels, while the Republic arms its loyal workers to hold the rest of the country. Spain is at war with itself."
  HSP_spain_news.2.a:0 "They shall not pass!"
  HSP_spain_news.2.b:0 "Spain bleeds again."
  HSP_spain_news.3.title:0 "Spanish Republic Breaks the Fascist Plot"
  HSP_spain_news.3.desc:0 "The government of [From.GetNameDef] has dismantled a conspiracy of generals and Falangists before it could strike. The plotters have been arrested or dismissed, and the Republic appears to have survived its most dangerous year without bloodshed."
  HSP_spain_news.3.a:0 "The Republic endures."
  HSP_spain_news.3.b:0 "A narrow escape."
  HSP_spain_news.4.title:0 "The Republic Triumphs in Spain"
  HSP_spain_news.4.desc:0 "The last strongholds of the military rebellion have fallen. After a bitter war, [From.GetNameDef] has restored its authority over the whole country, and the generals who rose against it are dead, captured or in exile."
  HSP_spain_news.4.a:0 "Spain is free."
  HSP_spain_news.4.b:0 "The rebellion has failed."
  HSP_spain_news.5.title:0 "Revolution in Portugal"
  HSP_spain_news.5.desc:0 "Portuguese communists, armed and supplied from across the border, have risen against the government in Lisbon. Spanish volunteers and regular troops are already fighting at their side."
  HSP_spain_news.5.a:0 "The revolution crosses the border!"
  HSP_spain_news.5.b:0 "Spain exports its revolution."
  HSP_spain_news.6.title:0 "Revolution in France"
  HSP_spain_news.6.desc:0 "French communists have risen against the government in Paris with open support from Spain. Spanish troops are crossing the Pyrenees to join them."
  HSP_spain_news.6.a:0 "Vive la Commune!"
  HSP_spain_news.6.b:0 "France is ablaze."
  HSP_spain_news.7.title:0 "Anarchist Revolution in Spain"
  HSP_spain_news.7.desc:0 "The anarchist unions of [From.GetNameDef] have seized power in Madrid, Barcelona and Valencia and proclaimed a free society without a state. The Republic's loyalists have taken up arms against the revolution, and Spain is once again at war with itself."
  HSP_spain_news.7.a:0 "The revolution has begun!"
  HSP_spain_news.7.b:0 "Spain bleeds once more."
  HSP_spain_news.8.title:0 "The Anarchists Triumph in Spain"
  HSP_spain_news.8.desc:0 "The last strongholds of the Republic have fallen to the militias of the CNT-FAI. For the first time, an entire country is run by its workers' collectives, without a state above them."
  HSP_spain_news.8.a:0 "No gods, no masters!"
  HSP_spain_news.8.b:0 "A strange experiment."
  HSP_spain_news.9.title:0 "Anarchist Uprising in Portugal"
  HSP_spain_news.9.desc:0 "Portuguese workers near the Spanish border have risen against the government in Lisbon, proclaiming communes in the Spanish fashion. Spanish militias are crossing the border to fight at their side."
  HSP_spain_news.9.a:0 "The torch passes to Portugal!"
  HSP_spain_news.9.b:0 "The fire spreads."
  HSP_spain_news.10.title:0 "Nationalist Uprising in Spain"
  HSP_spain_news.10.desc:0 "General Francisco Franco and the army have risen against the government of the Republic. Garrisons across Spain and Morocco have declared for the Nationalists, while the Republic arms the workers to hold the rest of the country."
  HSP_spain_news.10.a:0 "For God and Spain!"
  HSP_spain_news.10.b:0 "Spain bleeds again."
  HSP_spain_news.11.title:0 "The Nationalists Triumph in Spain"
  HSP_spain_news.11.desc:0 "The last strongholds of the Republic have fallen. After a bitter war, General Franco's Nationalists rule all of Spain, and the leaders of the Republic are dead, captured or in exile."
  HSP_spain_news.11.a:0 "The war is over."
  HSP_spain_news.11.b:0 "A new order in Spain."
